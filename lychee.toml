# Configuração do verificador de links (https://github.com/lycheeverse/lychee)
# Uso: lychee --no-progress './**/*.md'
#
# O LinkedIn responde HTTP 999 a qualquer verificador automatizado (bloqueio anti-bot),
# mesmo com o perfil no ar.
#
# gemini.google.com e keyframes.app: o cliente HTTP do lychee falha a negociação
# HTTP/2 com esses dois servidores ("HTTP/2 protocol error"), mesmo com --max-retries.
# Ambos foram verificados manualmente com curl nesta mesma sessão e respondem 200
# normalmente (gemini.google.com -> "Google Gemini"; keyframes.app -> 200, redireciona
# via JS). É uma limitação do cliente do lychee, não um link quebrado.
exclude = [
  "^https://www\\.linkedin\\.com/",
  "^https://gemini\\.google\\.com/",
  "^https://keyframes\\.app/",
]
